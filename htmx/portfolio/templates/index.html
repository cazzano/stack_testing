<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>./portfolio</title>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="layout">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="window-dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="topbar-title">~/portfolio <span>—</span> bash</div>
    </div>
    <div class="topbar-right">
      <div class="status-item">
        <div class="status-dot"></div>
        available for work
      </div>
      <div class="status-item">PKT: 2026-03-25</div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">// navigate</div>

      <a class="nav-item active"
         hx-get="/sections/home"
         hx-target="#main-content"
         hx-swap="innerHTML"
         hx-push-url="/home"
         hx-on::after-request="setActive(this)">
        <span class="icon">⌂</span> home
        <span class="badge">~</span>
      </a>

      <a class="nav-item"
         hx-get="/sections/projects"
         hx-target="#main-content"
         hx-swap="innerHTML"
         hx-push-url="/projects"
         hx-on::after-request="setActive(this)">
        <span class="icon">◈</span> projects
        <span class="badge">06</span>
      </a>

      <a class="nav-item"
         hx-get="/sections/skills"
         hx-target="#main-content"
         hx-swap="innerHTML"
         hx-push-url="/skills"
         hx-on::after-request="setActive(this)">
        <span class="icon">◉</span> skills
        <span class="badge">++</span>
      </a>

      <a class="nav-item"
         hx-get="/sections/about"
         hx-target="#main-content"
         hx-swap="innerHTML"
         hx-push-url="/about"
         hx-on::after-request="setActive(this)">
        <span class="icon">◎</span> about
      </a>

      <a class="nav-item"
         hx-get="/sections/contact"
         hx-target="#main-content"
         hx-swap="innerHTML"
         hx-push-url="/contact"
         hx-on::after-request="setActive(this)">
        <span class="icon">◌</span> contact
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">// stack</div>
      <div class="nav-item" style="font-size:11px;cursor:default">
        <span class="icon" style="color:#0088ff">▸</span> nuxt · vue
      </div>
      <div class="nav-item" style="font-size:11px;cursor:default">
        <span class="icon" style="color:#ffd700">▸</span> python · fastapi
      </div>
      <div class="nav-item" style="font-size:11px;cursor:default">
        <span class="icon" style="color:#ff3366">▸</span> rust · zig
      </div>
      <div class="nav-item" style="font-size:11px;cursor:default">
        <span class="icon" style="color:#00ff88">▸</span> linux · arch
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="profile-mini">
        <div class="avatar">H</div>
        <div class="profile-info">
          <div class="profile-name">hello@dev</div>
          <div class="profile-role">fullstack · ai/ml</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main content — HTMX swaps here -->
  <main class="main" id="main-content"
        hx-get="/sections/home"
        hx-trigger="load"
        hx-swap="innerHTML">
    <div class="loading">
      <span style="color:var(--accent)">▸</span> loading...
    </div>
  </main>

</div>

<!-- setActive: no framework, just a tiny helper that marks clicked nav item -->
<script>
function setActive(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}
</script>

</body>
</html>
